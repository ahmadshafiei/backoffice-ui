<div class="shell" [class.collapsed]="layout.collapsed() && !layout.isMobile()" [class.drawer-open]="layout.drawerOpen()">
  <a class="skip" href="#main">رفتن به محتوا</a>
  <app-navbar class="navbar" />

  <aside class="sidebar" id="sidebar">
    <app-menu [groups]="menu" [collapsed]="layout.collapsed() && !layout.isMobile()"
      (navigated)="layout.closeDrawer()" (expandRequested)="layout.setCollapsed(false)" />
  </aside>

  <div class="scrim" (click)="layout.closeDrawer()" aria-hidden="true"></div>

  <main class="content" id="main" tabindex="-1">
    <div class="page"><router-outlet /></div>
  </main>
  <app-footer class="footer" />
</div>
