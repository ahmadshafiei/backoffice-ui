<app-page-header title="دفتر کل" subtitle="حساب کل، بازه تاریخ و در صورت نیاز شعبه را انتخاب کنید." />

<section class="panel">
  <form class="filters" [formGroup]="form" (ngSubmit)="search()" novalidate>
    <app-datepicker label="از تاریخ" formControlName="startDate" [required]="true" />
    <app-datepicker label="تا تاریخ" formControlName="endDate" [required]="true" [messages]="dateMessages" />

    <app-select-field label="حساب کل" formControlName="accountId" [options]="accountOptions()"
      placeholder="انتخاب حساب کل" [required]="true" [hint]="loadingAccounts() ? 'در حال بارگذاری حساب‌ها…' : ''" />
    <app-select-field label="شعبه" formControlName="branchId" [options]="branchOptions" placeholder="همه شعب" />
    <div class="actions">
      <button type="submit" class="btn btn-primary" [disabled]="loadingAccounts()">
        <app-icon name="search" [size]="16" />جستجو
      </button>
    </div>
  </form>
</section>
