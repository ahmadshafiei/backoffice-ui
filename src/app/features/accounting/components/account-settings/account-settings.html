<app-page-header title="تنظیم حساب‌ها" subtitle="تعداد ارقام کد حساب را برای هر سطح تعیین کنید." />

<section class="panel">
  <header class="panel-head">
    <div>
      <h2>طول کد</h2>
      <p>تعداد ارقام کد را برای هر سطح حساب وارد کنید. مقدار هر سطح مستقل است و مبنای ساخت کد حساب قرار می‌گیرد.</p>
    </div>
  </header>

  <form class="lengths" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @for (field of fields; track field.control) {
      <app-text-field [label]="field.label" [formControlName]="field.control" [ltr]="true" [latinDigits]="true"
        inputmode="numeric" [required]="true"
        [messages]="{ pattern: 'فقط عدد وارد کنید.' }" />
    }

    <div class="actions">
      <button type="submit" class="btn btn-primary" [disabled]="busy() || loading()">
        <app-icon name="circle-check" [size]="16" />ذخیره
      </button>
      <button type="button" class="btn" [disabled]="busy() || loading()" (click)="load()">
        <app-icon name="refresh-cw" [size]="16" />بازخوانی
      </button>
    </div>
  </form>
</section>
