<app-page-header title="حساب‌های تفصیلی" [subtitle]="loading() && total() === 0 ? '' : (total() | faNumber) + ' حساب تفصیلی'" />

<section class="panel">
  <div class="toolbar">
    <button type="button" class="btn btn-primary" (click)="openCreate()"><app-icon name="plus" [size]="16" />ایجاد حساب تفصیلی</button>
  </div>

  <app-data-table [columns]="columns" [rows]="rows()" [total]="total()" [loading]="loading()" [rowKey]="rowKey"
    [(page)]="page" [(pageSize)]="pageSize" caption="فهرست حساب‌های تفصیلی"
    emptyTitle="حساب تفصیلی ثبت نشده است" emptyMessage="با دکمه «ایجاد حساب تفصیلی» اولین حساب را اضافه کنید.">
    <ng-template appCell="accountCode" let-row><span class="code">{{ row.accountCode }}</span></ng-template>
    <ng-template appCell="accountName" let-row><span class="name">{{ row.accountName }}</span></ng-template>
    <ng-template appCell="detailClassId" let-row>{{ detailClassName(row.detailClassId) }}</ng-template>
    <ng-template appCell="canBeUsedAsParty" let-row>
      @if (row.canBeUsedAsParty) { <span class="yes"><app-icon name="circle-check" [size]="18" /><span class="sr-only">بله</span></span> }
      @else { <span class="muted">خیر</span> }
    </ng-template>
    <ng-template appCell="isActive" let-row>
      <span class="chip" [class.is-active]="row.isActive" [class.is-inactive]="!row.isActive">{{ row.isActive ? 'فعال' : 'غیرفعال' }}</span>
    </ng-template>
    <ng-template appRowActions let-row>
      <button type="button" class="icon-btn" [attr.aria-label]="'ویرایش ' + row.accountName" title="ویرایش" (click)="openEdit(row)"><app-icon name="pencil" [size]="16" /></button>
      <button type="button" class="icon-btn danger" [attr.aria-label]="'حذف ' + row.accountName" title="حذف" (click)="askDelete(row)"><app-icon name="trash-2" [size]="16" /></button>
    </ng-template>
  </app-data-table>
</section>

<app-modal [(open)]="formOpen" [title]="editing() ? 'ویرایش حساب تفصیلی' : 'ایجاد حساب تفصیلی'" width="520px" [closeOnBackdrop]="false">
  @if (formOpen()) {
    <form id="detail-account-form" class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-select-field label="طبقه تفصیلی" formControlName="detailClassId" [options]="detailClassOptions()"
        placeholder="انتخاب طبقه تفصیلی" [required]="true" />
      <app-text-field label="کد حساب" formControlName="accountCode" [ltr]="true" [latinDigits]="true" inputmode="numeric"
        [required]="true" [messages]="{ pattern: 'کد حساب فقط شامل ارقام است.' }" />
      <app-text-field label="نام" formControlName="name" [required]="true" [messages]="{ pattern: 'این فیلد الزامی است.' }" />
      <app-toggle-field label="فعال" formControlName="isActive" />
      <app-toggle-field label="قابل استفاده به عنوان طرف حساب" formControlName="canBeUsedAsParty" />
    </form>
  }
  <ng-container modalFooter>
    <button type="submit" class="btn btn-primary" form="detail-account-form" [disabled]="busy()">{{ editing() ? 'ذخیره تغییرات' : 'ایجاد' }}</button>
    <button type="button" class="btn" [disabled]="busy()" (click)="formOpen.set(false)">انصراف</button>
  </ng-container>
</app-modal>

<app-confirm-dialog [(open)]="deleteOpen" title="حذف حساب تفصیلی" confirmLabel="حذف" [danger]="true" [busy]="busy()"
  [message]="'«' + (deleting()?.accountName ?? '') + '» حذف شود؟ این کار قابل بازگشت نیست.'" (confirmed)="confirmDelete()" />
