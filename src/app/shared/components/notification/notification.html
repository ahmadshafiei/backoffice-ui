<div class="stack" role="region" aria-label="اعلان‌ها">
  @for (toast of api.toasts(); track toast.id) {
    <div class="toast" [class]="'toast ' + toast.kind" [attr.role]="toast.kind === 'error' ? 'alert' : 'status'">
      <app-icon [name]="toast.kind === 'success' ? 'circle-check' : toast.kind === 'error' ? 'circle-alert' : 'info'" [size]="18" />
      <p>{{ toast.message }}</p>
      <button type="button" class="icon-btn" aria-label="بستن اعلان" (click)="api.dismiss(toast.id)"><app-icon name="x" [size]="16" /></button>
    </div>
  }
</div>
